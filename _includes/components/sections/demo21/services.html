<section class="wrapper bg-gradient-primary">
  <div class="container pt-0 pt-lg-0 pb-13 pb-md-13">
    <div class="row text-center">
      <div class="col-md-10 offset-md-1 col-lg-8 offset-lg-2">
        <h2 class="fs-16 text-uppercase text-primary mb-3">{{ page.services.title }}</h2>
        <h3 class="display-3 mb-10 px-xxl-10">{{ page.services.subtitle }}</h3>
      </div>
      <!-- /column -->
    </div>
    <!-- /.row -->
    <div class="row gx-lg-8 gx-xl-12 gy-11 px-3 px-md-4 px-lg-5 px-xxl-8 text-left">
      {% for service in page.services.service_items %}
      <div class="col-lg-4">
        <div class="px-md-15 px-lg-3">
          <figure class="mb-2"><img class="img-fluid" src="{{ service.image }}" style="max-height: 70px; width: auto;" srcset="{{ service.image2x }} 2x" alt="" /></figure>
          <h3>{{ service.title }}</h3>
          <p class="mb-2">{{ service.text }}</p>
        </div>
        <!--/.px -->
      </div>
      <!--/column -->
      {% endfor %}
    </div>
    <!--/.row -->
  </div>
  <!-- /.container -->
</section>
<!-- /section -->
